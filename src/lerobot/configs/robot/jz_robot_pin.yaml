type: jz_robot_pin
id: jz_robot_pin_default

bind_ip: 0.0.0.0
state_port: 39010
allowed_state_sender_ip: 192.168.1.81
connect_timeout_s: 300.0
state_timeout_s: 1.0
receive_buffer_size: 65535

command_target_ip: 192.168.1.81
command_target_port: 39020
send_action_transport: local
send_action_execution: dry_run
command_robot: robot1
command_timeout_s: 0.2

armed_env_var: JZ_ROBOT_PIN_ARMED
require_armed_env: true
max_initial_joint_delta_rad: 0.02
max_joint_step_rad: 0.02
state_seq_reset_timeout_s: 1.0
gripper_width_min: 0.0
gripper_width_max: 100.0
gripper_force_min: 0.0
gripper_force_max: 100.0

left_joint_names:
  - left_joint1
  - left_joint2
  - left_joint3
  - left_joint4
  - left_joint5
  - left_joint6
  - left_joint7

right_joint_names:
  - right_joint1
  - right_joint2
  - right_joint3
  - right_joint4
  - right_joint5
  - right_joint6
  - right_joint7

use_gripper: true

rtsp_cameras:
  camera_head:
    url: rtsp://192.168.1.81:8554/robot_camera/camera_head
    fps: 30
    width: 1280
    height: 720
    timeout_ms: 5000
    warmup_frames: 1
    color_mode: rgb
    transport: tcp

  camera_left:
    url: rtsp://192.168.1.81:8554/robot_camera/camera_left
    fps: 30
    width: 640
    height: 480
    timeout_ms: 5000
    warmup_frames: 1
    color_mode: rgb
    transport: tcp

  camera_right:
    url: rtsp://192.168.1.81:8554/robot_camera/camera_right
    fps: 30
    width: 640
    height: 480
    timeout_ms: 5000
    warmup_frames: 1
    color_mode: rgb
    transport: tcp
