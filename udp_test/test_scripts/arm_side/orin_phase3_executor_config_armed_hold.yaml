  right_joint3: [-0.218024316, -0.158024316]
  right_joint4: [1.507704819, 1.567704819]
  right_joint5: [-1.234626191, -1.174626191]
  right_joint6: [-0.188982045, -0.128982045]
  right_joint7: [-0.320544949, -0.260544949]

# Phase 3 armed on-robot validation: bypass motion numeric limits for on-robot validation.
# Other gates still apply, including sender IP, armed ack, packet freshness, and publish rate.
allow_joint_position_limit_bypass: true
allow_joint_delta_limit_bypass: true
allow_gripper_limit_bypass: true
allow_gripper_delta_limit_bypass: true

max_joint_delta_per_step:
  default: 0.01
  overrides: {}

initial_joint_positions:
  left_joint1: -0.046844637
  left_joint2: -1.238346072
  left_joint3: 0.216019399
  left_joint4: -1.547373958
  left_joint5: 1.225674884
  left_joint6: 0.187343646
  left_joint7: -0.046705013
  right_joint1: 0.043196897
  right_joint2: 1.216564343
  right_joint3: -0.188024316
  right_joint4: 1.537704819
  right_joint5: -1.204626191
  right_joint6: -0.158982045
  right_joint7: -0.290544949

gripper_limits:
  left:
    width: [98.0, 100.0]
    force: [0.0, 2.0]
    max_width_delta_per_step: 1.0
    max_force_delta_per_step: 1.0
  right:
    width: [98.0, 100.0]
    force: [6.0, 8.0]
    max_width_delta_per_step: 1.0
    max_force_delta_per_step: 1.0

initial_gripper_state:
