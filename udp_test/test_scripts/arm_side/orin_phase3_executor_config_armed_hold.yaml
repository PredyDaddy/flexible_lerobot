execution: "armed"
robot: "robot1"

network:
  bind_ip: "192.168.1.81"
  allowed_sender_ip: "192.168.1.106"
  command_port: 39020
  buffer_size: 65535

topics:
  left_arm_command_topic: "/robot1/telecon/arm_left/joint_commands_input"
  right_arm_command_topic: "/robot1/telecon/arm_right/joint_commands_input"
  left_gripper_command_topic: "/robot1/left_gripper/gripper_commands"
  right_gripper_command_topic: "/robot1/right_gripper/gripper_commands"

left_joint_names:
  - "left_joint1"
  - "left_joint2"
  - "left_joint3"
  - "left_joint4"
  - "left_joint5"
  - "left_joint6"
  - "left_joint7"

right_joint_names:
  - "right_joint1"
  - "right_joint2"
  - "right_joint3"
  - "right_joint4"
  - "right_joint5"
  - "right_joint6"
  - "right_joint7"

timeouts:
  max_command_age_s: 0.25
  max_clock_skew_s: 1.0
  command_timeout_s: 0.3
  socket_timeout_s: 0.2

rate_limits:
  max_publish_hz: 2.0

joint_position_limits:
  left_joint1: [-0.076844637, -0.016844637]
  left_joint2: [-1.268346072, -1.208346072]
  left_joint3: [0.186019399, 0.246019399]
