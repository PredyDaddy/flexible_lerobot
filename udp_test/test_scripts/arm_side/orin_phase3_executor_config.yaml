execution: "dry_run"
robot: "robot1"

network:
  bind_ip: "192.168.1.81"
  allowed_sender_ip: "192.168.1.106"
  command_port: 39020
  buffer_size: 65535

topics:
  left_arm_command_topic: "/robot1/telecon/arm_left/joint_commands_input"
  right_arm_command_topic: "/robot1/telecon/arm_right/joint_commands_input"
  left_gripper_command_topic: "/robot1/left_gripper/gripper_commands"
  right_gripper_command_topic: "/robot1/right_gripper/gripper_commands"
  left_joint_state_topic: "/robot1/arm_left/joint_states"
  right_joint_state_topic: "/robot1/arm_right/joint_states"
  left_gripper_state_topic: "/robot1/left_gripper/gripper_status"
  right_gripper_state_topic: "/robot1/right_gripper/gripper_status"

# Armed startup waits for all four sources. Every publish then rechecks freshness,
# cross-source skew, current-vs-approved tracking error, and command-vs-live delta.
live_state:
  startup_timeout_s: 15.0
  max_age_s: TODO_MAX_STATE_AGE_S
  max_skew_s: TODO_MAX_STATE_SKEW_S
  max_joint_tracking_error_rad: TODO_TRACKING_ERROR_RAD
  max_gripper_width_tracking_error: TODO_TRACKING_ERROR
  max_gripper_force_tracking_error: TODO_TRACKING_ERROR

left_joint_names:
  - "left_joint1"
  - "left_joint2"
  - "left_joint3"
  - "left_joint4"
  - "left_joint5"
  - "left_joint6"
  - "left_joint7"

right_joint_names:
  - "right_joint1"
  - "right_joint2"
  - "right_joint3"
  - "right_joint4"
  - "right_joint5"
  - "right_joint6"
  - "right_joint7"

timeouts:
  max_command_age_s: 0.25
  max_clock_skew_s: 1.0
  command_timeout_s: 0.3
  socket_timeout_s: 0.2

rate_limits:
  max_publish_hz: 10.0

joint_position_limits:
  left_joint1: [TODO_MIN, TODO_MAX]
  left_joint2: [TODO_MIN, TODO_MAX]
  left_joint3: [TODO_MIN, TODO_MAX]
  left_joint4: [TODO_MIN, TODO_MAX]
  left_joint5: [TODO_MIN, TODO_MAX]
  left_joint6: [TODO_MIN, TODO_MAX]
  left_joint7: [TODO_MIN, TODO_MAX]
  right_joint1: [TODO_MIN, TODO_MAX]
  right_joint2: [TODO_MIN, TODO_MAX]
  right_joint3: [TODO_MIN, TODO_MAX]
  right_joint4: [TODO_MIN, TODO_MAX]
  right_joint5: [TODO_MIN, TODO_MAX]
  right_joint6: [TODO_MIN, TODO_MAX]
  right_joint7: [TODO_MIN, TODO_MAX]

max_joint_delta_per_step:
  default: 0.02
  overrides: {}

initial_joint_positions:
  left_joint1: TODO_CURRENT_POSITION
  left_joint2: TODO_CURRENT_POSITION
  left_joint3: TODO_CURRENT_POSITION
  left_joint4: TODO_CURRENT_POSITION
  left_joint5: TODO_CURRENT_POSITION
  left_joint6: TODO_CURRENT_POSITION
  left_joint7: TODO_CURRENT_POSITION
  right_joint1: TODO_CURRENT_POSITION
  right_joint2: TODO_CURRENT_POSITION
  right_joint3: TODO_CURRENT_POSITION
  right_joint4: TODO_CURRENT_POSITION
  right_joint5: TODO_CURRENT_POSITION
  right_joint6: TODO_CURRENT_POSITION
  right_joint7: TODO_CURRENT_POSITION

gripper_limits:
  left:
    width: [TODO_MIN, TODO_MAX]
    force: [TODO_MIN, TODO_MAX]
    max_width_delta_per_step: TODO_DELTA
    max_force_delta_per_step: TODO_DELTA
  right:
    width: [TODO_MIN, TODO_MAX]
    force: [TODO_MIN, TODO_MAX]
    max_width_delta_per_step: TODO_DELTA
    max_force_delta_per_step: TODO_DELTA

initial_gripper_state:
  left:
    width: TODO_CURRENT_WIDTH
