# VLASH PI0 LoRA one-batch memory probe on the local SO101 desk-cleanup dataset.
# This mirrors the PI0.5 smoke config but uses the local PI0 base model.

policy:
  type: pi0
  pretrained_path: /data/cqy_workspace/flexible_lerobot/assets/modelscope/lerobot/pi0_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  gradient_checkpointing: true
  compile_model: false
  fuse_qkv: false
  fuse_gate_up: false
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: desk_cleanup_v1/eraser_cup_multi_task
  root: /data/cqy_workspace/flexible_lerobot/datasets/desk_cleanup_v1/eraser_cup_multi_task
  video_backend: pyav
  use_imagenet_stats: false

output_dir: /data/cqy_workspace/flexible_lerobot/my_devs/vla_engineering/train/outputs/pi0_so101_vlash_lora_memory_probe
job_name: pi0_so101_vlash_lora_memory_probe
batch_size: 1
grad_accum_steps: 1
steps: 1
num_workers: 0
seed: 1000

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1
  peak_lr: 5.0e-5
  decay_lr: 2.5e-6
  num_decay_steps: 1

save_checkpoint: false
save_freq: 1
log_freq: 1
wandb:
  enable: false

max_delay_steps: 1
shared_observation: false

lora:
  enable: true
  backend: peft
  r: 4
  alpha: 4
  dropout: 0.0
  extra_trainable_modules:
    - action_in_proj
    - action_out_proj
    - time_mlp_in
    - time_mlp_out
    - state_proj
    - state_mlp_in
    - state_mlp_out
    - input_layernorm
    - post_attention_layernorm
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - out_proj
    - fc1
    - fc2
